<!-- {"title": "Contact · Nadav Friedman", "description": "Book Nadav Friedman for concerts, recordings, lessons and masterclasses.", "nav": "contact", "path": "/contact"} -->
<section class="page-head">
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow">get in touch</span>
      <h1>Contact</h1>
      <p class="lede">Concert and festival bookings, studio sessions, lessons, masterclasses and press. Write a few lines and Nadav will get back to you.</p>
    </div>
    <figure>
      <img src="assets/photos/contact-kit.jpg" alt="Nadav at a drum kit in a dark room, reflected in the floor" width="800" height="1200">
    </figure>
  </div>
</section>

<section class="section" aria-label="Contact options">
  <div class="wrap contact-grid">
    <form class="contact" id="contact-form" novalidate>
      <div class="row2">
        <div class="field"><label for="f-name">name</label><input id="f-name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="f-email">email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
      </div>
      <div class="field">
        <label for="f-topic">what is it about?</label>
        <select id="f-topic" name="topic">
          <option>Concert or festival booking</option>
          <option>Book Bombaras</option>
          <option>Recording session</option>
          <option>Private lessons</option>
          <option>Masterclass or workshop</option>
          <option>Press</option>
          <option>Something else</option>
        </select>
      </div>
      <div class="field"><label for="f-message">message</label><textarea id="f-message" name="message" required placeholder="Date, place, and what you have in mind"></textarea></div>
      <div class="actions"><button class="btn" type="submit">send message</button></div>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>

    <div class="direct">
      <div class="item">
        <span class="eyebrow">email</span>
        <div class="v"><span id="email-text">nadaveron@gmail.com</span><button class="copy-btn" type="button" data-copy="email-text">copy</button></div>
      </div>
      <div class="item">
        <span class="eyebrow">concert updates</span>
        <div class="v"><a class="btn" href="https://chat.whatsapp.com/GjGj4pwP7kKLCDzW4AS8f1" target="_blank" rel="noopener"><span class="dot" aria-hidden="true"></span>join the whatsapp group</a></div>
      </div>
      <div class="item">
        <span class="eyebrow">lessons</span>
        <div class="v"><a class="textlink" href="https://calendly.com/nadavfriedman/privatelessons" target="_blank" rel="noopener">pick a time on calendly</a></div>
      </div>
      <div class="item">
        <span class="eyebrow">presenters &amp; press</span>
        <div class="v"><a class="textlink" href="https://drive.google.com/drive/folders/1A_PcJgzDMcSuGDMQdhq-y6S2Z4j4Alj1" target="_blank" rel="noopener">press kit, photos &amp; riders</a></div>
      </div>
    </div>
  </div>
</section>
